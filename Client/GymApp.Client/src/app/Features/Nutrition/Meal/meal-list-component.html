<div class="food-grid">
  @if (data && data.source.length > 0) {
    @for (meal of data.source; track meal.id) {
      <app-meal-item-component [meal]="meal"></app-meal-item-component>
    }
  } @else {
    <div class="empty-state">
      <div class="empty-state-icon">📋</div>
      <p>No food items available.</p>
    </div>
  }
</div>

<div class="paginator-row">
  <mat-paginator
    [length]="data?.total"
    [pageSize]="paginationParams.pagesize"
    [pageSizeOptions]="[3, 5, 10]"
    [showFirstLastButtons]="true"
    aria-label="Select page"
    (page)="handlePaginatorEvent($event)"
  >
  </mat-paginator>
</div>

<button class="add-food-button" routerLink="/nutrition/food/add" title="Add new food">
  <span class="button-icon">+</span>
</button>
